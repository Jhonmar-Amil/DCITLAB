<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4 Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="calcu">
            <div class="display" id="display">0</div>
            <div class="buttons">
                <button class="btn operator" onclick="clearDisplay()">AC</button>
                <button class="btn operator" onclick="appendOperator('/')">/</button>
                <button class="btn operator" onclick="appendOperator('*')">*</button>
                <button class="btn operator" onclick="appendOperator('-')">-</button>

                <button class="btn number" onclick="appendNumber('7')">7</button>
                <button class="btn number" onclick="appendNumber('8')">8</button>
                <button class="btn number" onclick="appendNumber('9')">9</button>
                <button class="btn operator" onclick="appendOperator('+')">+</button>

                <button class="btn number" onclick="appendNumber('4')">4</button>
                <button class="btn number" onclick="appendNumber('5')">5</button>
                <button class="btn number" onclick="appendNumber('6')">6</button>
                <button class="btn equal" onclick="calculate()">=</button>

                <button class="btn number" onclick="appendNumber('1')">1</button>
                <button class="btn number" onclick="appendNumber('2')">2</button>
                <button class="btn number" onclick="appendNumber('3')">3</button>
                <button class="btn number zero" onclick="appendNumber('0')">0</button>

                <button class="btn operator" onclick="appendNumber('.')">.</button>
            </div>
        </div>  

        <div class="instructions">
            <h2>User Guide</h2>
            <p><strong>How to use:</strong> Click or tap the numbers and operators to input your calculation. Press the equals (<strong>=</strong>) button to see the result. Use <strong>AC</strong> to clear the screen.</p>
            <p><strong>Supported Operations:</strong> Addition (+), Subtraction (−), Multiplication (×), and Division (÷).</p>
        </div>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
